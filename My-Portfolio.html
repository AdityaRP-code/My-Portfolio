/* Pulse-Wave — SLIDE visualiser: thin black + purple bars on white. */

/* Bars slide in one-by-one (staggered), heights wave like a slide across. */

/* A soft highlight sweeps left → right continuously over the bars. */

@keyframes viz-enter-x{
  from{
    transform:translateX(-140%);
    opacity:0
  }

  to{
    transform:translateX(0);
    opacity:1
  }
}

@keyframes viz-enter-y{
  from{
    transform:translateY(110%);
    opacity:0
  }

  to{
    transform:translateY(0);
    opacity:1
  }
}

@keyframes viz-bars{
  0%,100%{
    transform:scaleY(.45)
  }

  50%{
    transform:scaleY(1)
  }
}

@keyframes viz-wave{
  0%,100%{
    transform:scaleY(.35) translateY(4px)
  }

  50%{
    transform:scaleY(1) translateY(0)
  }
}

@keyframes viz-circle{
  0%,100%{
    transform:scaleY(.45)
  }

  50%{
    transform:scaleY(1.05)
  }
}

@keyframes viz-sweep{
  from{
    transform:translateX(-160%)
  }

  to{
    transform:translateX(420%)
  }
}

@keyframes viz-spin{
  from{
    transform:rotate(0deg)
  }

  to{
    transform:rotate(360deg)
  }
}

.viz-slide-wave{
  animation:viz-enter-x .55s cubic-bezier(.22,1,.36,1) both
}

.viz-slide-bars{
  animation:viz-enter-y .55s cubic-bezier(.22,1,.36,1) both
}

.viz-bar{
  transform-origin:bottom center;
  animation-timing-function:ease-in-out;
  animation-iteration-count:infinite
}

.viz-bars{
  animation-name:viz-bars
}

.viz-wave{
  animation-name:viz-wave
}

.viz-circle{
  transform-origin:top center;
  animation-name:viz-circle
}

.viz-spin{
  animation:viz-spin 9s linear infinite
}

.viz-sweep{
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  width:32%;
  pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(109,40,217,.16),rgba(255,255,255,.55),transparent);
  animation:viz-sweep 2.6s cubic-bezier(.22,1,.36,1) infinite
}

.viz-paused,.viz-paused *{
  animation-play-state:paused !important
}

.viz-paused .viz-bar,.viz-paused .viz-sweep{
  opacity:.55
}

/* ——— Subtle, premium motion ——— */

@keyframes icon-bob{
  0%,100%{
    transform:translateY(-1px)
  }

  50%{
    transform:translateY(2px)
  }
}

@keyframes icon-wiggle{
  0%,100%{
    transform:translateY(0) rotate(0deg)
  }

  50%{
    transform:translateY(-2px) rotate(-4deg)
  }
}

@keyframes bgm-pulse{
  0%,100%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.07)
  }
}

@keyframes hero-shimmer{
  0%{
    background-position:0% 50%
  }

  50%{
    background-position:100% 50%
  }

  100%{
    background-position:0% 50%
  }
}

@keyframes tagline-pulse{
  0%,100%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.02)
  }
}

/* All Lucide icons: slow idle bob, gentle wiggle on hover. */

header svg, main svg, footer svg{
  animation:icon-bob 3s ease-in-out infinite;
  transform-origin:center
}

a:hover svg, button:hover svg, article:hover svg, .group:hover svg{
  animation:icon-wiggle .55s ease-in-out
}

.bgm-on{
  animation:bgm-pulse 2.2s ease-in-out infinite
}

.bgm-on svg{
  animation:bgm-pulse 2.2s ease-in-out infinite
}

/* Hero name: very subtle gradient sweep every 4s. */

  background:linear-gradient(100deg,var(--laptop-text) 35%,var(--accent) 50%,var(--laptop-text) 65%);
  background-size:220% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:hero-shimmer 4s ease-in-out infinite
}

/* Hero tagline: gentle pulse. */

.tagline-pulse{
  animation:tagline-pulse 3.6s ease-in-out infinite;
  transform-origin:left center
}

/* Project titles: slide-up underline on hover. */

.project-title{
  position:relative;
  display:inline-block
}

.project-title::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-4px;
  height:2px;
  width:100%;
  background:currentColor;
  border-radius:999px;
  transform:scaleX(0);
  transform-origin:left center;
  transition:transform .35s ease
}

.group:hover .project-title::after,.project-title:hover::after{
  transform:scaleX(1)
}

/* Currently cards: gentle lift + icon bob. */

.currently-card{
  transition:transform .35s ease,box-shadow .35s ease
}

.currently-card:hover{
  transform:translateY(-4px);
  box-shadow:0 14px 28px rgba(0,0,0,.18)
}

.currently-card:hover svg{
  animation:icon-wiggle .55s ease-in-out
}

@media (prefers-reduced-motion:reduce){
  header svg, main svg, footer svg, .bgm-on, .bgm-on svg, .hero-name-shimmer, .tagline-pulse{
    animation:none !important
  }

  .currently-card{
    transition:none
  }
}

/* ——— Hero load — fade-up ONLY on the hero text ——— */

/* The laptop has NO load animation: its position is driven only by the scroll listener. */

@keyframes hero-load {
  from {
    opacity: 0;
    transform: translateY(18px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.hero-load{
  animation:hero-load .8s ease-out both
}

.laptop{
  will-change:transform
}

.laptop-pill{
  opacity:1
}

@media (prefers-reduced-motion:reduce){
  .hero-load{
    animation:none
  }

  .laptop-pill{
    animation:none;
    opacity:1;
    transform:none
  }
}
